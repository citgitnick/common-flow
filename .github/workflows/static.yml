name: Deploy Test Reports to GitHub Pages

on:
  push:
    branches: ["gh-pages"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Run Tests
      run: |
        echo "Run your tests here"

    - name: Verify report exists
      run: |
        ls -R bin/Debug/net8.0/Reports || true

    - name: Download existing Pages content
      uses: actions/download-pages-artifact@v2
      with:
        path: pages
      continue-on-error: true

    - name: Ensure pages directory
      run: mkdir -p pages

    - name: Add current run reports
      run: |
        RUN_ID=${{ github.run_id }}
        mkdir -p pages/$RUN_ID

        cp -r bin/Debug/net8.0/Reports/* pages/$RUN_ID/

        cd pages/$RUN_ID
        FIRST_FILE=$(ls *.html | head -n 1)
        cp "$FIRST_FILE" index.html

    - name: Keep last 5 runs
      run: |
        cd pages
        ls -dt */ 2>/dev/null | tail -n +6 | xargs rm -rf || true

    - name: Create index.html
      run: |
        echo '<!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Test Execution Reports</title>
          <style>
            body { font-family: Arial; background:#f4f6f8; padding:20px; }
            .container { max-width:800px; margin:auto; }
            .card { background:#fff; padding:15px; margin:10px 0; border-radius:10px; display:flex; justify-content:space-between; }
            .btn { background:#0078D4; color:white; padding:8px 12px; border-radius:6px; text-decoration:none; }
          </style>
          <script>
            function openAllReports() {
              const links = document.querySelectorAll(".report-link");
              links.forEach(link => window.open(link.href, "_blank"));
            }
          </script>
        </head>
        <body>
          <div class="container">
            <h1>Test Execution Reports</h1>
            <button class="btn" onclick="openAllReports()">Open All Reports</button>
        ' > pages/index.html

        for dir in $(ls -dt pages/*/ 2>/dev/null); do
          name=$(basename "$dir")
          echo "<div class=\"card\">
                  <div>Run: $name</div>
                  <a class=\"btn report-link\" href=\"$name/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">View Report</a>
                </div>" >> pages/index.html
        done

        echo '</div></body></html>' >> pages/index.html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: pages

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Send Teams Notification
      run: |
        REPORT_URL="${{ steps.deployment.outputs.page_url }}"

        curl -X POST "${{ vars.TEAMS_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"text\": \"Test Execution Completed. View Report: $REPORT_URL\"
          }"
