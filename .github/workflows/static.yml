name: Deploy Test Reports to GitHub Pages

on:
  push:
    branches: ["gh-pages"]   # change if needed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    # Checkout repo
    - name: Checkout
      uses: actions/checkout@v4

    # (Your test execution step goes here)
    - name: Run Tests
      run: |
        echo "Run your tests here"
        # Example:
        # dotnet test
        # or playwright test

    # Debug (optional)
    - name: Verify report exists
      run: |
        ls -R bin/Debug/net8.0/Reports || true

    # Get previous Pages content
    - name: Download existing Pages content
      run: |
        git clone --depth=1 --branch=gh-pages https://github.com/${{ github.repository }} old-pages || true
        mkdir -p pages
        cp -r old-pages/* pages/ || true

    # Add current run
    - name: Add current run reports
      run: |
        RUN_ID=${{ github.run_id }}
        mkdir -p pages/$RUN_ID
        cp -r bin/Debug/net8.0/Reports/* pages/$RUN_ID/

    # Keep only last 5 runs
    - name: Keep last 5 runs
      run: |
        cd pages
        ls -dt */ | tail -n +6 | xargs rm -rf || true

    # Create index.html
    - name: Create index.html
      run: |
        echo '<!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Test Execution Reports</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              background: #f4f6f8;
              margin: 0;
              padding: 20px;
            }
            h1 {
              text-align: center;
              color: #333;
            }
            .container {
              max-width: 800px;
              margin: auto;
            }
            .card {
              background: #ffffff;
              padding: 15px 20px;
              margin: 10px 0;
              border-radius: 10px;
              box-shadow: 0 2px 6px rgba(0,0,0,0.1);
              display: flex;
              justify-content: space-between;
              align-items: center;
            }
            .card:hover {
              transform: scale(1.01);
              transition: 0.2s;
            }
            .btn {
              background: #0078D4;
              color: white;
              padding: 8px 12px;
              text-decoration: none;
              border-radius: 6px;
              font-size: 14px;
            }
            .btn:hover {
              background: #005ea6;
            }
            .footer {
              text-align: center;
              margin-top: 20px;
              font-size: 12px;
              color: #777;
            }
          </style>

          <script>
            function openAllReports() {
              const links = document.querySelectorAll(".report-link");
              links.forEach(link => {
                window.open(link.href, "_blank");
              });
            }
          </script>
        </head>
        <body>
          <div class="container">
            <h1>🚀 Test Execution Reports</h1>

            <button class="btn" onclick="openAllReports()">Open All Reports</button>
        ' > pages/index.html

        for dir in $(ls -dt pages/*/); do
          name=$(basename "$dir")
          echo "<div class=\"card\">
                  <div>Run: $name</div>
                  <a class=\"btn report-link\" href=\"$name/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">View Report</a>
                </div>" >> pages/index.html
        done

        echo '
            <div class="footer">
              Generated by GitHub Actions
            </div>
          </div>
        </body>
        </html>' >> pages/index.html

    # Upload full pages folder
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: pages

    # Deploy
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    # Send Teams notification
    - name: Send Teams Notification
      run: |
        REPORT_URL="${{ steps.deployment.outputs.page_url }}"

        echo "Report URL: $REPORT_URL"

        curl -X POST "${{ vars.TEAMS_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"@type\": \"MessageCard\",
            \"@context\": \"http://schema.org/extensions\",
            \"summary\": \"Test Report\",
            \"themeColor\": \"0078D7\",
            \"title\": \"🚀 Test Execution Completed\",
            \"potentialAction\": [{
              \"@type\": \"OpenUri\",
              \"name\": \"View Report\",
              \"targets\": [{
                \"os\": \"default\",
                \"uri\": \"$REPORT_URL\"
              }]
            }]
          }"
