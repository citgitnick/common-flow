name: orchestrator flow

on:
  workflow_run:
    workflows:
      - "Common Workflow"
      - "Deploy test"
    types: completed
    branches: main

concurrency:
  group: orchestrator-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # JOB 1: Read all variables and decide what to do
  # ══════════════════════════════════════════════════════════════════════
  evaluate:
    name: Evaluate Deployment State
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.evaluate.outputs.decision }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: common-flow
          
      - name: Read all service statuses
        id: evaluate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BULK=$(gh variable get TEST_VAR --repo ${{ github.repository }} --json value -q .value 2>/dev/null || echo "not_triggered")
          COMMON=$(gh variable get DEPLOY_STATUS_COMMON --repo ${{ github.repository }} --json value -q .value 2>/dev/null || echo "not_triggered")
          PRODUCT=$(gh variable get DEPLOY_STATUS_PRODUCT --repo ${{ github.repository }} --json value -q .value 2>/dev/null || echo "not_triggered")
          TRANS=$(gh variable get DEPLOY_STATUS_TRANSACTION --repo ${{ github.repository }} --json value -q .value 2>/dev/null || echo "not_triggered")

          echo "bulk-upload : $BULK"
          echo "common      : $COMMON"
          echo "product     : $PRODUCT"
          echo "transaction : $TRANS"

          STATUSES=()
          for VAL in "$BULK" "$COMMON" "$PRODUCT" "$TRANS"; do
            [ "$VAL" != "not_triggered" ] && STATUSES+=("$VAL")
          done

          TOTAL=${#STATUSES[@]}
          PENDING=0; FAILED=0; SUCCESS=0

          for S in "${STATUSES[@]}"; do
            case "$S" in
              success) SUCCESS=$((SUCCESS + 1)) ;;
              failed)  FAILED=$((FAILED + 1))   ;;
              pending) PENDING=$((PENDING + 1)) ;;
            esac
          done

          echo "---"
          echo "Triggered: $TOTAL | Success: $SUCCESS | Pending: $PENDING | Failed: $FAILED"

          if   [ "$TOTAL" -eq 0 ];          then DECISION="no_deployments"
          elif [ "$PENDING" -gt 0 ];        then DECISION="wait"
          elif [ "$FAILED" -gt 0 ];         then DECISION="failed"
          elif [ "$SUCCESS" -eq "$TOTAL" ]; then DECISION="trigger_tests"
          else                                   DECISION="unknown"
          fi

          echo "Decision: $DECISION"
          echo "decision=$DECISION" >> $GITHUB_OUTPUT

  # ══════════════════════════════════════════════════════════════════════
  # JOB 2: Still waiting — exit 0 (not an error, just not ready yet)
  #         Shows as ✅ in GitHub UI — informational
  # ══════════════════════════════════════════════════════════════════════
  still-waiting:
    name: Waiting — deployments still in progress
    runs-on: ubuntu-latest
    needs: evaluate
    if: needs.evaluate.outputs.decision == 'wait'
    steps:
      - name: Exit gracefully — waiting for other deployments
        run: |
          echo "One or more deployments are still pending."
          echo "This orchestrator instance exits cleanly."
          echo "The next service completion will re-trigger evaluation."
          exit 0

  # ══════════════════════════════════════════════════════════════════════
  # JOB 3: Deployment failed — exit 1 (real failure, team must know)
  #         Shows as ❌ in GitHub UI — tests were blocked, action needed
  # ══════════════════════════════════════════════════════════════════════
  deployment-failed:
    name: Deployment failed — tests blocked
    runs-on: ubuntu-latest
    needs: evaluate
    if: needs.evaluate.outputs.decision == 'failed'
    steps:
      - name: Fail — one or more deployments failed
        run: |
          echo "One or more service deployments failed."
          echo "Test automation will NOT be triggered."
          echo "Fix the failing deployment and re-deploy."
          exit 1

  # ══════════════════════════════════════════════════════════════════════
  # JOB 4: No deployments found — exit 0 (nothing went wrong)
  #         Shows as ✅ in GitHub UI — informational
  # ══════════════════════════════════════════════════════════════════════
  no-deployments:
    name: No deployments found for this run
    runs-on: ubuntu-latest
    needs: evaluate
    if: |
      needs.evaluate.outputs.decision == 'no_deployments' ||
      needs.evaluate.outputs.decision == 'unknown'
    steps:
      - name: Exit gracefully — nothing to act on
        run: |
          echo "No triggered deployment status found."
          echo "No action taken."
          exit 0

  # ══════════════════════════════════════════════════════════════════════
  # JOB 5: All succeeded — trigger tests then reset variables
  #         Shows as ✅ in GitHub UI — happy path
  # ══════════════════════════════════════════════════════════════════════
  trigger-tests:
    name: Trigger Test Automation
    runs-on: ubuntu-latest
    needs: evaluate
    if: needs.evaluate.outputs.decision == 'trigger_tests'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: common-flow
          
      # - name: Dispatch test automation pipeline
      #   run: |
      #     HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
      #       -X POST \
      #       -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
      #       -H "Accept: application/vnd.github+json" \
      #       -H "X-GitHub-Api-Version: 2022-11-28" \
      #       "https://api.github.com/repos/${{ vars.TEST_AUTOMATION_REPO }}/actions/workflows/run-tests.yml/dispatches" \
      #       -d '{"ref": "${{ vars.TEST_AUTOMATION_BRANCH }}"}')

      #     echo "HTTP Status: $HTTP_STATUS"
      #     cat /tmp/response.json

      #     if [ "$HTTP_STATUS" -ne 204 ]; then
      #       echo "ERROR: Failed to dispatch test automation pipeline."
      #       exit 1
      #     fi

      #     echo "Test automation pipeline triggered successfully."

      # Uses GitHub App token here too — GITHUB_TOKEN cannot write variables
      # when triggered via workflow_run from a different workflow context
      - name: Reset all status variables for next deployment
        run: |
          for VAR in TEST_VAR DEPLOY_STATUS_COMMON DEPLOY_STATUS_PRODUCT DEPLOY_STATUS_TRANSACTION; do
            # gh variable set $VAR --body "not_triggered" --repo ${{ github.repository }}
            CURRENT=$(gh variable get $VAR \
              --repo ${{ github.repository }} \
              --json value -q .value 2>/dev/null || echo "")
      
            if [ "$CURRENT" != "not_triggered" ]; then
              echo "Updating $VAR (current: $CURRENT)"
              gh variable set $VAR --body "not_triggered" --repo ${{ github.repository }}
            else
              echo "Skipping $VAR (already not_triggered)"
            fi
          done
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
