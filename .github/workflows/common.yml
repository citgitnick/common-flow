name: Common Workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # GitHub App token — needed for gh variable set (GITHUB_TOKEN cannot write variables)
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: common-flow

      - name: Set status = pending
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh variable set DEPLOY_STATUS_PRODUCT --body "pending"

      - name: Deploy service
        run: |
          echo "Deployment step here..."
          # ./scripts/deploy.sh
          sleep 60

      - name: Set status = success
        if: success()
        run: gh variable set $VAR_NAME --body "success" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Set status = failed
        if: failure()
        run: gh variable set $VAR_NAME --body "failed" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
