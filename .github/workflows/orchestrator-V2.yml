name: orchestrator flow v2

on:
  workflow_run:
    workflows:
      - "Common Workflow"
      - "Deploy test"
    types: completed
    branches: main
  workflow_dispatch:

concurrency:
  group: orchestrator-${{ github.event.workflow_run.head_sha }}
  # cancel-in-progress: false
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  evaluate:
    name: Evaluate Deployment State
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.evaluate.outputs.decision }}

    steps:
      - name: Wait for API to reflect completed status
        run: sleep 10
        
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: common-flow
          
      - name: Read all service statuses
        id: evaluate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Evaluating SHA: $SHA"

          # Fetch all workflow runs for this exact SHA
          RUNS=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
            --jq '.workflow_runs[] | select(.name) | 
            {name: .name, status: .status, conclusion: .conclusion}')

          echo "Runs found for SHA $SHA:"
          echo "$RUNS"

          TOTAL=$(echo "$RUNS"    | jq -s 'length')
          IN_PROGRESS=$(echo "$RUNS" | jq -s '[.[] | select(.status != "completed")] | length')
          FAILED=$(echo "$RUNS"   | jq -s '[.[] | select(.conclusion == "failure")] | length')
          SUCCESS=$(echo "$RUNS"  | jq -s '[.[] | select(.conclusion == "success")] | length')

          echo "---"
          echo "Total   : $TOTAL"
          echo "Running : $IN_PROGRESS"
          echo "Success : $SUCCESS"
          echo "Failed  : $FAILED"

          if   [ "$TOTAL" -eq 0 ];               then DECISION="no_deployments"
          elif [ "$IN_PROGRESS" -gt 0 ];         then DECISION="wait"
          elif [ "$FAILED" -gt 0 ];              then DECISION="failed"
          elif [ "$SUCCESS" -eq "$TOTAL" ];      then DECISION="trigger_tests"
          else                                        DECISION="unknown"
          fi

          echo "Decision: $DECISION"
          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          
  # ══════════════════════════════════════════════════════════════════════
  # JOB 2: Still waiting — exit 0 (not an error, just not ready yet)
  #         Shows as ✅ in GitHub UI — informational
  # ══════════════════════════════════════════════════════════════════════
  still-waiting:
    name: Waiting — deployments still in progress
    runs-on: ubuntu-latest
    needs: evaluate
    if: needs.evaluate.outputs.decision == 'wait'
    steps:
      - name: Log and cancel
        run: echo "Deployments still in progress. Cancelling this instance."
      - name: Cancel this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel

  # ══════════════════════════════════════════════════════════════════════
  # JOB 3: Deployment failed — exit 1 (real failure, team must know)
  #         Shows as ❌ in GitHub UI — tests were blocked, action needed
  # ══════════════════════════════════════════════════════════════════════
  deployment-failed:
    name: Deployment failed — tests blocked
    runs-on: ubuntu-latest
    needs: evaluate
    if: needs.evaluate.outputs.decision == 'failed'
    steps:
      - name: Fail — deployment failed, tests not triggered
        run: |
          echo "One or more deployments failed. Tests will not be triggered."
          exit 1

  # ══════════════════════════════════════════════════════════════════════
  # JOB 4: No deployments found — exit 0 (nothing went wrong)
  #         Shows as ✅ in GitHub UI — informational
  # ══════════════════════════════════════════════════════════════════════
  no-deployments:
    name: No deployments found for this run
    runs-on: ubuntu-latest
    needs: evaluate
    if: |
      needs.evaluate.outputs.decision == 'no_deployments' ||
      needs.evaluate.outputs.decision == 'unknown'
    steps:
      - name: Log and cancel
        run: echo "No QA deployment runs found for this SHA."
      - name: Cancel this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel

  # ══════════════════════════════════════════════════════════════════════
  # JOB 5: All succeeded — trigger tests then reset variables
  #         Shows as ✅ in GitHub UI — happy path
  # ══════════════════════════════════════════════════════════════════════
  trigger-tests:
    name: Trigger Test Automation
    runs-on: ubuntu-latest
    needs: evaluate
    if: needs.evaluate.outputs.decision == 'trigger_tests'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: common-flow
          
      # - name: Dispatch test automation pipeline
      #   run: |
      #     HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
      #       -X POST \
      #       -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
      #       -H "Accept: application/vnd.github+json" \
      #       -H "X-GitHub-Api-Version: 2022-11-28" \
      #       "https://api.github.com/repos/${{ vars.TEST_AUTOMATION_REPO }}/actions/workflows/run-tests.yml/dispatches" \
      #       -d '{"ref": "${{ vars.TEST_AUTOMATION_BRANCH }}"}')

      #     echo "HTTP Status: $HTTP_STATUS"
      #     cat /tmp/response.json

      #     if [ "$HTTP_STATUS" -ne 204 ]; then
